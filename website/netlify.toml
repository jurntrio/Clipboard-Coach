[build]
command = "npm run build"
publish = ".next"

[[redirects]]
from = "/*"
to = "https://app.sportvisualsystems.com/:splat"
status = 301
force = true
conditions = { Host = ["sportvisualsystems.com", "clipboardcoachstudio.com"] }

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/branding/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
for = "/icons/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
for = "/clubboys/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
